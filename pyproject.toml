[project]
name = "nova-ember"
version = "0.1.0"
description = "Source-linked exploration of NASA combustion research"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pint>=0.24,<1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "openai==3.51.0",
  "openai-agents==0.24.0",
  "pypdf==7.1.0",
  "pyarrow>=21,<24",
  "pillow==13.0.0",
  "xlrd>=2.0.2,<3",
  "polars>=1.35,<2",
  "duckdb>=1.4,<2",
  "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "services/api/src",
  "services/workers/src",
  "packages/domain/src",
  "packages/analysis/src",
  "packages/data-adapters/src",
  "packages/contracts/src",
  "packages/evidence/src",
  "packages/modeling/src",
  "packages/agent-tools/src",
]
addopts = "-ra --strict-markers"
markers = ["integration: requires the separate local test database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
mypy_path = [
  "services/api/src",
  "services/workers/src",
  "packages/domain/src",
  "packages/analysis/src",
  "packages/data-adapters/src",
  "packages/contracts/src",
  "packages/evidence/src",
  "packages/modeling/src",
  "packages/agent-tools/src",
  "scripts",
]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
